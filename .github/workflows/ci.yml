name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Formatting, lint, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint TypeScript and SCSS
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile=test-results/unit/report.json

      - name: Build optimized application
        run: npm run build

      - name: Upload unit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-results-${{ github.run_attempt }}
          path: test-results/unit/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Chromium desktop/mobile (${{ matrix.suite }})
    needs: quality
    # Versioned screenshots use Playwright's win32 platform suffix.
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [optimized, strict-mode]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Playwright Chromium
        run: npx playwright install chromium

      - name: Build optimized application
        if: matrix.suite == 'optimized'
        run: npm run build

      - name: Run optimized E2E and visual tests
        if: matrix.suite == 'optimized'
        run: npx playwright test

      - name: Run development StrictMode tests
        if: matrix.suite == 'strict-mode'
        run: npx playwright test --config=playwright.strict.config.ts

      - name: Upload browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-reports-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
